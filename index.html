<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현대테라타워 향동 입주민 매뉴얼</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#002C5F">

<style>
  /* 🎨 현대 시그니처 테마 (언제든 이전 색상으로 되돌릴 수 있습니다) */
  :root {
    --bg: #F8FAFC;            /* 깔끔한 미색 배경 */
    --surface: #FFFFFF;       /* 카드 흰색 배경 */
    --ink: #0F172A;           /* 메인 텍스트 (다크 네이비/블랙) */
    --ink-soft: #475569;      /* 부텍스트 */
    --line: #E2E8F0;          /* 구분선 */
    --brand: #002C5F;         /* 현대 딥 네이비 (메인 포인트) */
    --brand-soft: #F0F4F8;    /* 연한 네이비 백그라운드 */
    --accent: #C8A261;        /* 매트 골드 (버튼/하이라이트) */
    --accent-ink: #FFFFFF;   /* 버튼 글자색 */
    --radius-lg: 16px;
    --radius-md: 10px;
    --shadow: 0 4px 12px rgba(0, 44, 95, 0.06);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", Pretendard, sans-serif;
    display: flex; justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .phone {
    width: 100%; max-width: 440px; min-height: 100vh;
    background: var(--bg); display: flex; flex-direction: column; position: relative;
  }

  /* 상단 헤더 */
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .topbar-inner { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
  .topbar-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    background: var(--brand-soft); color: var(--brand); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .topbar-title { flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: var(--brand); }
  .topbar-call {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold;
  }

  main { flex: 1; padding: 18px 16px 40px; }

  /* 메인 카드 메뉴 (동적 생성) */
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .menu-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 20px 16px; text-align: left;
    cursor: pointer; display: flex; flex-direction: column; gap: 12px;
    box-shadow: var(--shadow); transition: transform 0.1s ease;
  }
  .menu-card:active { transform: scale(0.98); }
  .menu-card .ic {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--brand-soft); display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .menu-card .label { font-size: 15px; font-weight: 700; color: var(--brand); line-height: 1.3; }

  /* 상세 화면 블록 */
  .block {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .block-head .ic {
    width: 36px; height: 36px; border-radius: 10px; background: var(--brand-soft);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .block-head h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--brand); }

  /* 이미지 슬라이더 */
  .slider-container {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    gap: 8px; border-radius: 12px; margin: 12px 0;
    -webkit-overflow-scrolling: touch;
  }
  .slider-item { flex: 0 0 100%; scroll-snap-align: start; position: relative; }
  .slider-item img {
    width: 100%; border-radius: 10px; display: block; object-fit: cover;
    cursor: zoom-in; border: 1px solid var(--line);
  }
  .slider-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0, 44, 95, 0.85); color: #fff; font-size: 11px;
    padding: 3px 8px; border-radius: 10px;
  }

  /* 전화 걸기 버튼 (매트 골드 포인트) */
  .call-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px; border-radius: var(--radius-md);
    background: var(--accent); color: var(--accent-ink); text-decoration: none;
    font-size: 14px; font-weight: 700; margin-top: 14px; border: none;
  }

  /* 모달 */
  .modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
  }
  .modal img { max-width: 92vw; max-height: 85vh; border-radius: 8px; }

  section.page { display: none; }
  section.page.active { display: block; }
</style>
</head>
<body>
<div class="phone">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="topbar-btn" id="backBtn">🏠</button>
      <div class="topbar-title" id="pageTitle">현대테라타워 향동</div>
      <a class="topbar-call" href="tel:0231584166">☎</a>
    </div>
  </header>

  <main>
    <!-- 홈 화면 -->
    <section class="page active" data-page="home">
      <div style="padding: 4px 2px 12px;">
        <p style="font-size:13px; color:var(--ink-soft); margin:0 0 4px; font-weight:500;">입주민 안내 매뉴얼</p>
        <h1 style="margin:0; font-size:22px; font-weight:700;">원하시는 항목을<br><span style="color:var(--brand)">선택해 주세요</span></h1>
      </div>
      <div class="menu-grid" id="menuGrid">
        <!-- 구글 시트 항목에 따라 자동으로 메뉴 생성 -->
      </div>
    </section>

    <!-- 상세 화면 -->
    <section class="page" data-page="detail">
      <h2 id="categoryTitle" style="font-size:19px; font-weight:700; margin-bottom:16px; color:var(--brand);"></h2>
      <div id="detailContent"></div>
    </section>
  </main>
</div>

<!-- 이미지 확대 모달 -->
<div class="modal" id="imageModal" onclick="this.style.display='none'">
  <img id="modalImg" src="" alt="확대 이미지">
</div>

<script>
  // 🔗 구글 시트에서 생성한 CSV 주소를 이곳 큰따옴표 안으로 복사해 붙여넣으세요.
  const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQslU5t5gIF2MfbrjxQmjlcGwJKmLYZzmT6md8w4hHW5TlhF4R9-rn7dXzqj-JRzk_1CUIbNwydd2Jn/pub?output=csv";

  let appData = [];
  let currentStack = ['home'];

  function parseCSV(text) {
    let lines = [];
    let row = [''];
    let inQuotes = false;
    for (let c of text) {
      if (c === '"') { inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes) { row.push(''); }
      else if ((c === '\r' || c === '\n') && !inQuotes) {
        if (row.length > 1 || row[0] !== '') lines.push(row);
        row = [''];
      } else { row[row.length - 1] += c; }
    }
    if (row.length > 1 || row[0] !== '') lines.push(row);
    return lines;
  }

  async function loadData() {
    if (!GOOGLE_SHEET_CSV_URL) {
      // 샘플 예시 데이터
      appData = [
        ["01. 전입 / 전출", "입주자 등록 및 전출 정산", "🚚", "", "지산동 지하2층 관리사무소 방문 등록 (임대차계약서, 사업자등록증, 차량등록증 필요)", "02-3158-4166"],
        ["02. 주차장 이용", "차량 등록 및 방문차량 주차", "🚗", "", "무료주차: 호실당 1대 (창고 월 66시간)\n방문차량 아이파킹 멤버스 앱 등록 후 할인 적용", "010-4242-1627"]
      ];
      renderHome();
      return;
    }

    try {
      const res = await fetch(GOOGLE_SHEET_CSV_URL);
      const csvText = await res.text();
      const parsed = parseCSV(csvText);
      appData = parsed.slice(1);
      renderHome();
    } catch (e) {
      console.error("데이터 불러오기 실패:", e);
    }
  }

  function renderHome() {
    const grid = document.getElementById('menuGrid');
    const categories = [...new Set(appData.map(row => row[0]))].filter(Boolean);
    
    grid.innerHTML = categories.map(cat => {
      const item = appData.find(row => row[0] === cat);
      const icon = (item && item[2]) ? item[2] : '🏢';
      return `
        <button class="menu-card" onclick="openCategory('${cat}')">
          <div class="ic">${icon}</div>
          <div class="label">${cat}</div>
        </button>
      `;
    }).join('');
  }

  function openCategory(category) {
    currentStack.push('detail');
    document.getElementById('pageTitle').textContent = category;
    document.getElementById('categoryTitle').textContent = category;
    document.getElementById('backBtn').textContent = '←';

    const items = appData.filter(row => row[0] === category);
    const container = document.getElementById('detailContent');

    container.innerHTML = items.map(item => {
      const title = item[1];
      const icon = item[2] || '📌';
      const images = item[3] ? item[3].split(',').map(s => s.trim()).filter(Boolean) : [];
      const content = item[4] ? item[4].replace(/\n/g, '<br>') : '';
      const phone = item[5];

      let sliderHtml = '';
      if (images.length > 0) {
        sliderHtml = `
          <div class="slider-container">
            ${images.map((img, idx) => `
              <div class="slider-item">
                <img src="${img}" onclick="openModal('${img}')" alt="안내 이미지">
                ${images.length > 1 ? `<div class="slider-badge">${idx + 1} / ${images.length} (좌우로 스와이프)</div>` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }

      return `
        <div class="block">
          <div class="block-head"><div class="ic">${icon}</div><h3>${title}</h3></div>
          ${sliderHtml}
          ${content ? `<p style="font-size:14px; line-height:1.6; color:var(--ink); margin:8px 0 0;">${content}</p>` : ''}
          ${phone ? `<a class="call-btn" href="tel:${phone.replace(/[^0-9]/g, '')}">📞 Direct Call (${phone})</a>` : ''}
        </div>
      `;
    }).join('');

    renderPages();
  }

  function renderPages() {
    const current = currentStack[currentStack.length - 1];
    document.querySelectorAll('section.page').forEach(p => {
      p.classList.toggle('active', p.dataset.page === current);
    });
    if (current === 'home') {
      document.getElementById('pageTitle').textContent = '현대테라타워 향동';
      document.getElementById('backBtn').textContent = '🏠';
    }
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    if (currentStack.length > 1) currentStack.pop();
    renderPages();
  });

  function openModal(imgSrc) {
    document.getElementById('modalImg').src = imgSrc;
    document.getElementById('imageModal').style.display = 'flex';
  }

  loadData();
</script>
</body>
</html>
