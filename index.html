<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현대테라타워 향동 입주민 매뉴얼</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#002C5F">

<style>
  /* 🎨 현대 시그니처 테마 및 앱 잠금 설정 */
  :root {
    --bg: #F8FAFC;            
    --surface: #FFFFFF;       
    --ink: #0F172A;           
    --ink-soft: #475569;      
    --line: #E2E8F0;          
    --brand: #002C5F;         /* 현대 딥 네이비 */
    --brand-soft: #F0F4F8;    
    --accent: #C8A261;        
    --accent-ink: #FFFFFF;   
    --radius-lg: 16px;
    --radius-md: 10px;
    --shadow: 0 4px 12px rgba(0, 44, 95, 0.06);
  }

  * { 
    box-sizing: border-box; 
    -webkit-user-select: none;   
    user-select: none;            
    -webkit-touch-callout: none;  
  }

  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", Pretendard, sans-serif;
    display: flex; justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .phone {
    width: 100%; max-width: 440px; min-height: 100vh;
    background: var(--bg); display: flex; flex-direction: column;
  }

  /* 상단 헤더 */
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .topbar-inner { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
  .topbar-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none;
    background: var(--brand-soft); color: var(--brand); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .topbar-title { 
    flex: 1; text-align: center; 
    font-size: 17.5px; 
    font-weight: 800;   
    color: var(--brand); 
    letter-spacing: -0.5px;
  }
  .topbar-call {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center; text-decoration: none; 
    font-size: 18px; 
  }

  main { flex: 1; padding: 18px 16px 40px; display: flex; flex-direction: column; }

  /* 1단계 선택 카드 (3개 구역) */
  .type-select-container { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
  .type-card {
    background: var(--surface); border: 2px solid var(--line);
    border-radius: var(--radius-lg); padding: 20px 18px; text-align: left;
    cursor: pointer; display: flex; align-items: center; gap: 16px;
    box-shadow: var(--shadow); transition: all 0.15s ease;
  }
  .type-card:active { transform: scale(0.98); border-color: var(--brand); }
  .type-card .ic {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--brand-soft); display: flex; align-items: center; justify-content: center; font-size: 26px;
    flex-shrink: 0;
  }
  .type-card .info { flex: 1; }
  .type-card .info h3 { margin: 0 0 4px 0; font-size: 17px; font-weight: 700; color: var(--brand); }
  .type-card .info p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .type-card .arrow { font-size: 18px; color: var(--accent); font-weight: bold; }

  /* 건물 유형 전환 배너 */
  .selection-badge {
    background: var(--brand-soft); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .selection-badge .txt { font-size: 13px; color: var(--brand); font-weight: 600; }
  .selection-badge button {
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }

  /* 2단계 메인 카드 메뉴 */
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .menu-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 20px 16px; text-align: left;
    cursor: pointer; display: flex; flex-direction: column; gap: 12px;
    box-shadow: var(--shadow); transition: transform 0.1s ease;
  }
  .menu-card:active { transform: scale(0.98); }
  .menu-card .ic {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--brand-soft); display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .menu-card .label { font-size: 15px; font-weight: 700; color: var(--brand); line-height: 1.3; }

  /* 3단계 상세 화면 블록 */
  .block {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .block-head .ic {
    width: 36px; height: 36px; border-radius: 10px; background: var(--brand-soft);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .block-head h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--brand); }

  /* 이미지 슬라이더 */
  .slider-container {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    gap: 8px; border-radius: 12px; margin: 4px 0;
    -webkit-overflow-scrolling: touch;
  }
  .slider-item { flex: 0 0 100%; scroll-snap-align: start; position: relative; }
  .slider-item img {
    width: 100%; border-radius: 10px; display: block; object-fit: cover;
    cursor: zoom-in; border: 1px solid var(--line);
  }
  .slider-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0, 44, 95, 0.85); color: #fff; font-size: 11px;
    padding: 3px 8px; border-radius: 10px;
  }

  /* 전화 걸기 버튼 */
  .call-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px; border-radius: var(--radius-md);
    background: var(--accent); color: var(--accent-ink); text-decoration: none;
    font-size: 14px; font-weight: 700; margin-top: 14px; border: none;
  }

  /* 모달 */
  .modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
  }
  .modal img { max-width: 92vw; max-height: 85vh; border-radius: 8px; }

  /* 🎮 게임 크레딧 스타일 하단 제작자 문구 (상하 여백 2배 확대) */
  .footer-credit {
    margin-top: auto;
    padding: 48px 0 20px; /* 기존 대비 상하 여백을 2배로 확장 */
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
    opacity: 0.7;
    font-family: monospace;
  }

  section.page { display: none; flex: 1; flex-direction: column; }
  section.page.active { display: flex; }
</style>
</head>
<body>
<div class="phone">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="topbar-btn" id="backBtn">🏠</button>
      <div class="topbar-title" id="pageTitle">현대테라타워 향동</div>
      <a class="topbar-call" href="tel:0231584166">📞</a>
    </div>
  </header>

  <main>
    <!-- 1단계: 3가지 구역 선택 화면 -->
    <section class="page active" data-page="select-building">
      <div style="padding: 4px 2px 12px;">
        <p style="font-size:13px; color:var(--ink-soft); margin:0 0 4px; font-weight:500;">Step 1. 입주 구역 선택</p>
        <h1 style="margin:0; font-size:22px; font-weight:700;">해당하시는 구역을<br><span style="color:var(--brand)">선택해 주세요</span></h1>
      </div>

      <div class="type-select-container">
        <div class="type-card" onclick="selectZone('지산', '지식산업센터')">
          <div class="ic">🏢</div>
          <div class="info">
            <h3>지식산업센터</h3>
            <p>드라이브인, 제조, 오피스, 창고</p>
          </div>
          <div class="arrow">➔</div>
        </div>

        <div class="type-card" onclick="selectZone('오피스텔', '오피스텔')">
          <div class="ic">🏠</div>
          <div class="info">
            <h3>오피스텔</h3>
            <p>라이브오피스 및 주거용 오피스텔</p>
          </div>
          <div class="arrow">➔</div>
        </div>

        <div class="type-card" onclick="selectZone('근생', '근린생활시설 (상가)')">
          <div class="ic">🛍️</div>
          <div class="info">
            <h3>근린생활시설</h3>
            <p>상가, 병원, 학원, 식음료 매장</p>
          </div>
          <div class="arrow">➔</div>
        </div>
      </div>

      <!-- 게임 크레딧 스타일 제작자 표기 -->
      <div class="footer-credit">made by tera management office 2026</div>
    </section>

    <!-- 2단계: 필터링된 메뉴 목록 화면 -->
    <section class="page" data-page="home">
      <div class="selection-badge">
        <span class="txt" id="selectedBuildingLabel">선택: 지식산업센터</span>
        <button onclick="goTypeSelect()">구역 변경 🏠</button>
      </div>

      <div style="padding: 0 2px 12px;">
        <h1 style="margin:0; font-size:20px; font-weight:700;">원하시는 안내를<br><span style="color:var(--brand)">선택해 주세요</span></h1>
      </div>

      <div class="menu-grid" id="menuGrid">
        <!-- 공통 + 선택 구역 메뉴가 표시됩니다 -->
      </div>

      <div class="footer-credit">made by tera management office 2026</div>
    </section>

    <!-- 3단계: 상세 내용 화면 -->
    <section class="page" data-page="detail">
      <h2 id="categoryTitle" style="font-size:19px; font-weight:700; margin-bottom:16px; color:var(--brand);"></h2>
      <div id="detailContent"></div>

      <div class="footer-credit">made by tera management office 2026</div>
    </section>
  </main>
</div>

<!-- 이미지 확대 모달 -->
<div class="modal" id="imageModal" onclick="this.style.display='none'">
  <img id="modalImg" src="" alt="확대 이미지">
</div>

<script>
  const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1wLHJwsQ2LvLc73ijrGPF0Knxh8JxkNIwLm_FSoKpzLM/gviz/tq?tqx=out:csv";

  const DEFAULT_DATA = [
    ["01. 전입 / 전출", "입주자 등록 및 전출 정산 안내", "🚚", "", "• 입주자 등록: 전입 시 지산동 지하2층 관리사무소 방문 등록\n• 필요서류: 임대차계약서, 사업자등록증, 차량등록증 (사진 제출 가능)\n• 전출 정산: 전출 2~3일 전 관리사무소 연락하여 관리비 정산\n• 엘리베이터 이용: 전입/전출 시 관리사무소 사전 연락 필수\n• 대형폐기물: 스티커 구매·부착 후 1층 쓰레기장 배출", "02-3158-4166", "공통"],
    ["02. 주차장 이용", "차량 등록 및 방문차량 주차", "🚗", "", "• 무료주차: 호실당 1대 (창고는 월 1시간권 66시간 무료)\n• 유료주차: 호실별 월요금 관리사무소 문의\n• 방문차량: 아이파킹 멤버스 앱으로 무료시간 적용\n  - 지산: 1시간(주말 2시간) 무료\n  - 근생: 2시간(주말 3시간) 무료\n  - 오피스텔: 월 72시간 무료\n• 전기차 충전: 지하1층 방재실 카드 등록 후 이용 (관리비 통합)", "010-4242-1627", "공통"],
    ["02. 주차장 이용", "아이파킹 멤버스 앱 이용방법", "📱", "", "• 앱 다운로드: 스토어에서 [아이파킹 멤버스] 검색 후 설치\n• 입주사 계정:\n  - ID: terat + 호실번호 (오피는 terah + 호실번호)\n  - PW: 최초 로그인 시 아이디와 동일 (접속 후 변경 필수)\n• 방문주차 등록: 차량번호 4자리 입력 ➔ 고객 차량 확인 ➔ 할인권 적용", "1588-5783", "공통"],
    ["02. 주차장 이용", "", "", "https://drive.google.com/file/d/1-FALBohERHGTwx7uRq2s6gdDPbggf7Nf/view?usp=drive_link", "", "", "공통"],
    ["03. 쓰레기 배출", "생활 및 재활용 쓰레기 배출 안내", "🗑️", "", "• 일반/대형 쓰레기: 1층 휴게공간 옆 쓰레기장 (종량제봉투 사용)\n• 대형폐기물: 편의점에서 스티커 구매 후 부착 (무단 배출 시 CCTV 고지)\n• 재활용 쓰레기: 지하 1층 분리수거장 배출\n  - 스티로폼: 스티커 및 테이프 제거 후 배출\n  - 박스: 큰 박스는 펼쳐서 배출", "02-3158-4166", "공통"],
    ["04. 오피스텔 생활", "공동현관 로비폰 비밀번호 변경", "🔐", "", "1. 월패드 메인화면에서 [방범] 클릭\n2. [설정] ➔ [비밀번호 변경] 클릭\n3. 현재 비밀번호 입력 (초기 비밀번호: 0000)\n4. [로비 비밀번호] 체크 후 [비밀번호 변경] 클릭\n5. 새 비밀번호(4~8자리) 입력 후 [확인] 누름\n※ 비밀번호 분실 시 현대HT 고객센터 문의", "1588-1087", "오피스텔"],
    ["05. 지식산업센터 / 근생", "냉난방 및 환기 시설 이용안내", "🏢", "", "• 중앙 냉난방, 환기, 난방 시설 이용 수칙 안내\n• 작동 방법 및 상세 문의사항은 관리사무소로 연락 주시기 바랍니다.", "02-3158-4166", "지산, 근생"]
  ];

  let appData = [...DEFAULT_DATA];
  let currentZoneCode = ''; 
  let currentZoneName = '';
  let currentStack = ['select-building'];

  function formatImageUrl(url) {
    if (!url) return '';
    url = url.trim();
    const match = url.match(/(?:[\?&]id=|\/d\/)([a-zA-Z0-9_-]+)/);
    if (match && (url.includes('drive.google.com') || url.includes('googleusercontent.com'))) {
      return `https://lh3.googleusercontent.com/d/${match[1]}`;
    }
    return url;
  }

  function parseCSV(text) {
    let lines = [];
    let row = [''];
    let inQuotes = false;
    for (let c of text) {
      if (c === '"') { inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes) { row.push(''); }
      else if ((c === '\r' || c === '\n') && !inQuotes) {
        if (row.length > 1 || row[0] !== '') lines.push(row);
        row = [''];
      } else { row[row.length - 1] += c; }
    }
    if (row.length > 1 || row[0] !== '') lines.push(row);
    return lines;
  }

  async function loadData() {
    try {
      const res = await fetch(GOOGLE_SHEET_CSV_URL);
      if (!res.ok) throw new Error("네트워크 응답 오류");
      const csvText = await res.text();
      const parsed = parseCSV(csvText);
      if (parsed.length > 1) {
        appData = parsed.slice(1);
        if (currentStack[currentStack.length - 1] === 'home') {
          renderHome();
        }
      }
    } catch (e) {
      console.warn("구글 시트 로드 대기중, 기본 백업 데이터 사용:", e);
    }
  }

  function selectZone(code, name) {
    currentZoneCode = code;
    currentZoneName = name;
    currentStack.push('home');
    document.getElementById('selectedBuildingLabel').textContent = `선택: ${name}`;
    renderHome();
    renderPages();
  }

  function goTypeSelect() {
    currentStack = ['select-building'];
    renderPages();
  }

  function getFilteredItems() {
    return appData.filter(row => {
      const target = row[6] ? row[6].trim() : '공통';
      if (!target || target.includes('공통')) return true;
      if (target.includes(currentZoneCode)) return true;
      return false;
    });
  }

  function renderHome() {
    const grid = document.getElementById('menuGrid');
    const filteredRows = getFilteredItems();
    const categories = [...new Set(filteredRows.map(row => row[0]))].filter(Boolean);

    grid.innerHTML = categories.map(cat => {
      const item = filteredRows.find(row => row[0] === cat);
      const icon = (item && item[2]) ? item[2] : '🏢';
      return `
        <button class="menu-card" onclick="openCategory('${cat}')">
          <div class="ic">${icon}</div>
          <div class="label">${cat}</div>
        </button>
      `;
    }).join('');
  }

  function openCategory(category) {
    currentStack.push('detail');
    document.getElementById('pageTitle').textContent = category;
    document.getElementById('categoryTitle').textContent = category;

    const filteredRows = getFilteredItems();
    const items = filteredRows.filter(row => row[0] === category);
    const container = document.getElementById('detailContent');

    container.innerHTML = items.map(item => {
      const title = item[1] ? item[1].trim() : '';
      const icon = item[2] || '📌';
      const images = item[3] ? item[3].split(',').map(s => formatImageUrl(s)).filter(Boolean) : [];
      const content = item[4] ? item[4].replace(/\n/g, '<br>').trim() : '';
      const phone = item[5] ? item[5].trim() : '';

      let sliderHtml = '';
      if (images.length > 0) {
        sliderHtml = `
          <div class="slider-container">
            ${images.map((img, idx) => `
              <div class="slider-item">
                <img src="${img}" onclick="openModal('${img}')" alt="안내 이미지">
                ${images.length > 1 ? `<div class="slider-badge">${idx + 1} / ${images.length} (좌우로 스와이프)</div>` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }

      const headHtml = title ? `<div class="block-head"><div class="ic">${icon}</div><h3>${title}</h3></div>` : '';

      return `
        <div class="block">
          ${headHtml}
          ${sliderHtml}
          ${content ? `<p style="font-size:14px; line-height:1.6; color:var(--ink); margin:8px 0 0;">${content}</p>` : ''}
          ${phone ? `<a class="call-btn" href="tel:${phone.replace(/[^0-9]/g, '')}">📞 전화 걸기 (${phone})</a>` : ''}
        </div>
      `;
    }).join('');

    renderPages();
  }

  function renderPages() {
    const current = currentStack[currentStack.length - 1];
    document.querySelectorAll('section.page').forEach(p => {
      p.classList.toggle('active', p.dataset.page === current);
    });

    const backBtn = document.getElementById('backBtn');
    const titleEl = document.getElementById('pageTitle');

    if (current === 'select-building') {
      titleEl.textContent = '현대테라타워 향동';
      backBtn.textContent = '🏠';
    } else if (current === 'home') {
      titleEl.textContent = currentZoneName;
      backBtn.textContent = '🏠';
    } else {
      backBtn.textContent = '←';
    }
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    if (currentStack.length > 1) {
      currentStack.pop();
      renderPages();
    } else {
      goTypeSelect();
    }
  });

  function openModal(imgSrc) {
    document.getElementById('modalImg').src = imgSrc;
    document.getElementById('imageModal').style.display = 'flex';
  }

  loadData();
</script>
</body>
</html>
